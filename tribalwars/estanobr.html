<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Tribal Wars — Nick Comparator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      :root {
        --bg: #0b1020;
        --panel: #111827;
        --border: #1f2933;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --success: #22c55e;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: linear-gradient(135deg, #020617, #0b1020);
        color: var(--text);
        padding: 30px;
      }

      .app {
        max-width: 1100px;
        margin: auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 15px;
      }

      .title h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
      }

      .title p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      input,
      textarea {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 14px;
      }

      .world-input {
        width: 140px;
        text-transform: lowercase;
      }

      .filter-input {
        width: 140px;
      }

      textarea {
        width: 100%;
        height: 170px;
        resize: vertical;
        margin-top: 14px;
      }

      button {
        background: var(--primary);
        border: none;
        color: white;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: #2563eb;
      }

      .btn-copy {
        background: var(--border);
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 6px;
        color: var(--text);
      }

      .btn-copy:hover {
        background: var(--muted);
        color: #fff;
      }

      .filters-section {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        align-items: center;
        background: rgba(17, 24, 39, 0.5);
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      .filters-section span {
        font-size: 14px;
        color: var(--muted);
      }

      .stats {
        margin-top: 14px;
        font-size: 13px;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 24px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
      }

      .card h3 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .card-header-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .badge {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
      }

      .badge.success {
        background: rgba(34, 197, 94, 0.15);
        color: var(--success);
      }

      .badge.danger {
        background: rgba(239, 68, 68, 0.15);
        color: var(--danger);
      }

      pre {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--text);
      }

      .pts-info {
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div class="app">
      <div class="header">
        <div class="title">
          <h1>Tribal Wars — Nick Comparator</h1>
          <p>
            Comparação inteligente de nicks com normalização avançada e filtros
            de pontos
          </p>
        </div>

        <div class="controls">
          <input id="world" class="world-input" value="140" placeholder="140 ou br140" />
          <button onclick="carregarJogadores()">Carregar mundo</button>
        </div>
      </div>

      <div class="filters-section">
        <span>Filtros de Pontos:</span>
        <input
          id="minPoints"
          class="filter-input"
          type="number"
          placeholder="Mínimo (ex: 1000)"
          min="0"
        />
        <input
          id="maxPoints"
          class="filter-input"
          type="number"
          placeholder="Máximo (ex: 50000)"
          min="0"
        />
      </div>

      <textarea
        id="input"
        placeholder="Cole aqui:
nick:pass
nick:pass:email"
      ></textarea>

      <button style="margin-top: 12px" onclick="comparar()">
        Comparar e Filtrar
      </button>

      <div class="stats" id="stats">Nenhum mundo carregado</div>

      <div class="grid">
        <div class="card">
          <h3>
            <div class="card-header-left">
              Encontrados
              <span class="badge success" id="foundCount">0</span>
            </div>
            <button class="btn-copy" onclick="copiarApenasNickPass('found')">
              Copiar
            </button>
          </h3>
          <pre id="found"></pre>
        </div>

        <div class="card">
          <h3>
            <div class="card-header-left">
              Não encontrados
              <span class="badge danger" id="notFoundCount">0</span>
            </div>
            <button class="btn-copy" onclick="copiarApenasNickPass('notFound')">
              Copiar
            </button>
          </h3>
          <pre id="notFound"></pre>
        </div>
      </div>
    </div>

    <script>
      let nickMap = new Map()

      function normalizarNick(nick) {
        return nick
          .toLowerCase()
          .replace(/\+/g, " ")
          .replace(/-+/g, " - ")
          .replace(/\s+/g, " ")
          .trim()
      }

      function sanitizeWorld(w) {
        w = String(w || "").trim().toLowerCase()

        if (/^br\d+$/.test(w)) {
          return w.replace("br", "")
        }

        if (/^\d+$/.test(w)) {
          return w
        }

        throw new Error("World inválido (ex: 140 ou br140)")
      }

      function getWorldUrl(world) {
        const w = sanitizeWorld(world)
        return `https://api.lucaslimadev.com.br/map-player?world=${encodeURIComponent(w)}`
      }

      async function carregarJogadores() {
        const world = document.getElementById("world").value.trim()
        if (!world) return alert("Informe um mundo")

        const stats = document.getElementById("stats")
        stats.innerText = "Carregando jogadores..."

        try {
          const res = await fetch(getWorldUrl(world))
          if (!res.ok) throw new Error(`HTTP ${res.status}`)

          const text = await res.text()
          const linhas = text.split("\n").filter((l) => l.trim())

          nickMap.clear()

          for (const l of linhas) {
            const partes = l.split(",")
            if (partes.length >= 5) {
              let nickBruto = partes[1]
              try {
                nickBruto = decodeURIComponent(nickBruto.replace(/\+/g, "%20"))
              } catch (e) {}

              const nick = normalizarNick(nickBruto)
              const pontos = parseInt(partes[4], 10) || 0

              nickMap.set(nick, pontos)
            }
          }

          const worldSanitized = sanitizeWorld(world)
          stats.innerText = `Mundo BR${worldSanitized} — ${nickMap.size} jogadores carregados`

          document.getElementById("found").innerHTML = ""
          document.getElementById("notFound").innerHTML = ""
          document.getElementById("foundCount").innerText = "0"
          document.getElementById("notFoundCount").innerText = "0"
        } catch (err) {
          console.error(err)
          stats.innerText = "Erro ao carregar o mundo"
          nickMap.clear()
        }
      }

      function comparar() {
        if (nickMap.size === 0) {
          alert("Carregue um mundo primeiro")
          return
        }

        const minP = parseInt(document.getElementById("minPoints").value) || 0
        const maxP =
          parseInt(document.getElementById("maxPoints").value) || Infinity

        const linhas = document
          .getElementById("input")
          .value.split("\n")
          .filter((l) => l.trim())

        const encontrados = []
        const naoEncontrados = []

        for (const linha of linhas) {
          const nickBruto = linha.split(":")[0]
          const nick = normalizarNick(nickBruto)

          if (nickMap.has(nick)) {
            const pontos = nickMap.get(nick)

            if (pontos >= minP && pontos <= maxP) {
              encontrados.push(
                `${linha} <span class="pts-info">[${pontos.toLocaleString("pt-BR")} pts]</span>`,
              )
            } else {
              naoEncontrados.push(
                `${linha} <span class="pts-info">[Fora do filtro: ${pontos.toLocaleString("pt-BR")} pts]</span>`,
              )
            }
          } else {
            naoEncontrados.push(
              `${linha} <span class="pts-info">[Não existe no BR]</span>`,
            )
          }
        }

        encontrados.sort()
        naoEncontrados.sort()

        document.getElementById("found").innerHTML = encontrados.join("\n")
        document.getElementById("notFound").innerHTML =
          naoEncontrados.join("\n")
        document.getElementById("foundCount").innerText = encontrados.length
        document.getElementById("notFoundCount").innerText =
          naoEncontrados.length
      }

      function copiarApenasNickPass(idElemento) {
        const pre = document.getElementById(idElemento)
        if (!pre || !pre.innerText) return

        const linhas = pre.innerText.split("\n").filter((l) => l.trim())

        const linhasLimpas = linhas.map((linha) => {
          const base = linha.split(" [")[0].trim()
          const partes = base.split(":")
          if (partes.length >= 2) {
            return `${partes[0]}:${partes[1]}`
          }
          return base
        })

        const textoParaCopiar = linhasLimpas.join("\n")

        navigator.clipboard
          .writeText(textoParaCopiar)
          .then(() => alert("Lista copiada com sucesso (apenas nick e senha)!"))
          .catch((err) => {
            console.error("Erro ao copiar: ", err)
            alert("Falha ao copiar. Verifique as permissões do navegador.")
          })
      }
    </script>
  </body>
</html>
